<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Form</title>
    <style>
        body { margin: 0; padding: 24px; font-family: Arial, sans-serif; color: #222; background: #f5f6f8; }
        .container { max-width: 760px; margin: auto; padding: 24px; background: white; border: 1px solid #ddd; }
        h1 { margin-top: 0; }
        h2 { margin-top: 26px; padding-bottom: 6px; border-bottom: 1px solid #ddd; color: #8b1e3f; font-size: 18px; }
        .grid { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; align-items: center; }
        .grid > label { font-weight: bold; }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea { width: 100%; box-sizing: border-box; padding: 7px; }
        .options { grid-column: 2; display: flex; flex-wrap: wrap; gap: 12px; }
        .options label, .check-list label { font-weight: normal; }
        .check-list { grid-column: 2; display: grid; gap: 8px; }
        .wide { grid-column: 1 / -1; }
        .buttons { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
        .buttons button { padding: 8px 18px; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 14px; }
            .grid { grid-template-columns: 1fr; gap: 6px; }
            .options, .check-list { grid-column: 1; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Donation Registration</h1>
        <p><strong>*</strong> Required information</p>
        <p>1. Donation &nbsp; → &nbsp; 2. Confirmation &nbsp; → &nbsp; 3. Thank You</p>
        <form action="#" method="post">
            <h2>Donor Information</h2>
            <div class="grid">
                <label for="given-name">First Name *</label>
                <input id="given-name" name="firstName" type="text" required>
                <label for="family-name">Last Name *</label>
                <input id="family-name" name="lastName" type="text" required>
                <label for="organization">Company or Organization</label>
                <input id="organization" name="company" type="text">
                <label for="street-address">Street Address *</label>
                <input id="street-address" name="address" type="text" required>
                <label for="address-extra">Address Line 2</label>
                <input id="address-extra" name="address2" type="text">
                <label for="donor-city">City *</label>
                <input id="donor-city" name="city" type="text" required>
                <label for="donor-state">State / Region *</label>
                <select id="donor-state" name="state" required>
                    <option value="">Choose a region</option>
                    <option>Dhaka</option>
                    <option>Chattogram</option>
                    <option>Khulna</option>
                    <option>Rajshahi</option>
                </select>
                <label for="postal-code">Postal Code *</label>
                <input id="postal-code" name="postalCode" type="text" required>
                <label for="donor-country">Country *</label>
                <select id="donor-country" name="country" required>
                    <option value="">Choose a country</option>
                    <option>Bangladesh</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>
                    <option>United States</option>
                </select>
                <label for="donor-phone">Phone</label>
                <input id="donor-phone" name="phone" type="tel">
                <label for="donor-email">Email *</label>
                <input id="donor-email" name="email" type="email" required>
            </div>

            <h2>Donation Details</h2>
            <div class="grid">
                <label>Donation Amount *</label>
                <div class="options">
                    <label><input type="radio" name="amount" value="25" required> $25</label>
                    <label><input type="radio" name="amount" value="50"> $50</label>
                    <label><input type="radio" name="amount" value="100"> $100</label>
                    <label><input type="radio" name="amount" value="200"> $200</label>
                    <label><input type="radio" name="amount" value="other"> Other</label>
                </div>
                <label for="custom-amount">Other Amount ($)</label>
                <input id="custom-amount" name="customAmount" type="text">
                <label for="recurring-gift">Recurring Donation</label>
                <div><input id="recurring-gift" name="recurring" type="checkbox"> I would like to donate regularly</div>
                <label for="monthly-gift">Monthly Amount ($)</label>
                <input id="monthly-gift" name="monthlyAmount" type="text">
            </div>

            <h2>Tribute Information</h2>
            <div class="grid">
                <label>Donation Type</label>
                <div class="options">
                    <label><input type="radio" name="tributeType" value="honor"> In Honor Of</label>
                    <label><input type="radio" name="tributeType" value="memory"> In Memory Of</label>
                </div>
                <label for="tribute-person">Person's Name</label>
                <input id="tribute-person" name="tributeName" type="text">
                <label for="recipient-name">Acknowledgment Recipient</label>
                <input id="recipient-name" name="acknowledgmentRecipient" type="text">
                <label for="recipient-address">Recipient Address</label>
                <input id="recipient-address" name="recipientAddress" type="text">
            </div>

            <h2>Additional Information</h2>
            <div class="grid">
                <label for="display-name">Name for Publication</label>
                <input id="display-name" name="publicationName" type="text">
                <label for="donor-comments">Comments or Questions</label>
                <textarea id="donor-comments" name="comments" rows="3"></textarea>
                <span>Contact preference</span>
                <div class="options">
                    <label><input type="checkbox" name="contactEmail" value="yes"> Email</label>
                    <label><input type="checkbox" name="contactPhone" value="yes"> Phone</label>
                    <label><input type="checkbox" name="contactMail" value="yes"> Postal Mail</label>
                </div>
                <div class="check-list">
                    <label><input type="checkbox" name="anonymous"> Keep my donation anonymous</label>
                    <label><input type="checkbox" name="newsletter"> Send me news and event updates</label>
                    <label><input type="checkbox" name="volunteer"> I am interested in volunteering</label>
                </div>
            </div>
            <div class="buttons">
                <button type="reset">Clear Form</button>
                <button type="submit">Continue</button>
            </div>
        </form>
    </main>
</body>
</html>
